# Standalone local TTS stack — run separately from xiaozhi-server.
#
# VieNeu (Vietnamese v3 Turbo, CPU/ONNX):
#   ./run-vieneu-tts.sh up
#
# Kokoro-82M (English, CPU/ONNX):
#   ./run-kokoro-tts.sh up
#
# Point xiaozhi-server data/.config.yaml CustomTTS url at host port, e.g.:
#   http://127.0.0.1:8882/v1/audio/speech          (server on host)
#   http://host.docker.internal:8882/v1/audio/speech (server in Docker on Mac)

name: blue-tts

services:
  vieneu-tts:
    profiles: ["vieneu"]
    build:
      context: ../vieneu-tts
      dockerfile: Dockerfile
      args:
        VIENEU_REPO: ${VIENEU_REPO:-https://github.com/pnnbao97/VieNeu-TTS.git}
        VIENEU_REF: ${VIENEU_REF:-main}
    image: blue-vieneu-tts:latest
    container_name: blue-vieneu-tts
    restart: unless-stopped
    ports:
      - "${VIENEU_TTS_PORT:-8882}:8882"
    volumes:
      - vieneu-hf-cache:/root/.cache/huggingface
    environment:
      VIENEU_REPO: ${VIENEU_REPO:-https://github.com/pnnbao97/VieNeu-TTS.git}
      VIENEU_REF: ${VIENEU_REF:-main}
      VIENEU_DEFAULT_VOICE: ${VIENEU_DEFAULT_VOICE:-Ngọc Lan}
      HF_HOME: /root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8882/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  kokoro-tts:
    profiles: ["kokoro"]
    build:
      context: ../kokoro
      dockerfile: Dockerfile
    image: blue-kokoro-tts:latest
    container_name: blue-kokoro-tts
    restart: unless-stopped
    ports:
      - "${KOKORO_TTS_PORT:-8883}:8883"
    environment:
      KOKORO_DEFAULT_VOICE: ${KOKORO_DEFAULT_VOICE:-af_heart}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8883/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  vieneu-hf-cache:
