# Blue xiaozhi-server stack for Ubuntu / Linux
#
# Server only:
#   ./run-docker.sh up
#
# Local TTS runs in a separate stack (configure url in data/.config.yaml):
#   ./run-vieneu-tts.sh up    # VieNeu on :8882
#   ./run-kokoro-tts.sh up    # Kokoro (English) on :8883
#
# Edit main/xiaozhi-server/data/.config.yaml before first run:
#   server.websocket: ws://<ubuntu-lan-ip>:8000/xiaozhi/v1/
#   server.vision_explain: http://<ubuntu-lan-ip>:8003/mcp/vision/explain

name: esp32-server-blue

services:
  xiaozhi-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: esp32-server-blue:latest
    container_name: blue-xiaozhi-server
    restart: unless-stopped
    ports:
      - "${SERVER_WS_PORT:-8000}:8000"
      - "${SERVER_HTTP_PORT:-8003}:8003"
    volumes:
      - ./main/xiaozhi-server/data:/opt/xiaozhi-esp32-server/data
      - ./main/xiaozhi-server/tmp:/opt/xiaozhi-esp32-server/tmp
      - ./main/xiaozhi-server/music:/opt/xiaozhi-esp32-server/music
      # Uncomment when selected_module.ASR is FunASR:
      # - ./main/xiaozhi-server/models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
    environment:
      TZ: ${TZ:-UTC}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8003/xiaozhi/ota/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - blue

  # Self-hosted local speaker recognition (3D-Speaker). Fully offline after the
  # model is downloaded once from ModelScope. Point server voiceprint.url at:
  #   http://<lan-ip>:8005/voiceprint/health?key=<VOICEPRINT_KEY>
  voiceprint-local:
    build:
      context: ./docker/voiceprint-local
      dockerfile: Dockerfile
    image: esp32-server-blue-voiceprint:latest
    container_name: blue-voiceprint-local
    restart: unless-stopped
    ports:
      - "${VOICEPRINT_PORT:-8005}:8005"
    environment:
      TZ: ${TZ:-UTC}
      VOICEPRINT_KEY: ${VOICEPRINT_KEY:-abcd}
      VOICEPRINT_THRESHOLD: ${VOICEPRINT_THRESHOLD:-0.55}
      VOICEPRINT_MODEL_ID: ${VOICEPRINT_MODEL_ID:-iic/speech_campplus_sv_zh_en_16k-common_advanced}
      VOICEPRINT_DEVICE: ${VOICEPRINT_DEVICE:-cpu}
    volumes:
      - voiceprint-data:/app/data
      - voiceprint-cache:/app/.cache/modelscope
    networks:
      - blue

networks:
  blue:
    driver: bridge

volumes:
  voiceprint-data:
  voiceprint-cache:
